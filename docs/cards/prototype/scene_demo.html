<title>德厚当·牌桌试玩</title>
<meta name="description" content="一九三八年江南小镇的当铺：像素柜台场景、炉石式手牌、对话为载体的卡牌试玩原型。">
<style>
@import url("https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap");
/* 德厚当 · 柜台场景版。单一夜色主题：像素柜台场景铺满，牌在最下面，对话框是载体。 */
:root{
  color-scheme: dark;
  --bg-deep:#0d0a08; --bg:#1e140d; --wood:#2b1c12; --wood-2:#3a281b; --wood-3:#4a3423; --line:#5c432d; --umber:#6b4a2e;
  --paper:#e9dcb8; --paper-2:#d8c592; --ink:#1d1611; --ink-2:#4b3a2a; --ink-3:#7a6650;
  --seal:#b3372a; --seal-2:#86231a; --seal-ink:#fbeee0;
  --gold:#e8c35a; --gold-2:#a37a1f; --gold-3:#fff0b8; --gold-glow:rgba(232,195,90,.5);
  --indigo:#34506d; --moss:#55683f; --iron:#55595c; --plum:#5d2b3b;
  --text:#efe3c7; --text-2:#c4ae8a; --text-3:#94806a;
  --good:#8dbb83; --warn:#e3a84d; --bad:#e0715a; --focus:#ffd98a;
  --f-brush:"Ma Shan Zheng","STKaiti","KaiTi","Kaiti SC","BiauKai",serif;
  --f-body:"Noto Serif SC","Songti SC","STSong","SimSun","Source Han Serif SC",serif;
  --string:#c9b48a; --scale-mark:#e8d9b0; --brass:#c99a3e; --brass-edge:#5a3a18; --pan:#b8863f; --pivot:#d9b25a; --beam:#8a5a2c; --beam-edge:#3a2412;
  --w-good-1:#e8c35a; --w-good-2:#d4ab3f; --w-mid-1:#e2d2a8; --w-mid-2:#cdbb8c; --w-bad-1:#9e3328; --w-bad-2:#7b2219;
  --s:4;
}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overflow:clip;background:var(--bg-deep);}
body{font-family:var(--f-body);color:var(--text);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;}
#app{position:fixed;inset:0;overflow:hidden;overflow:clip;background:radial-gradient(ellipse at 50% 40%,#1c130c 0%,#0d0a08 70%);user-select:none;-webkit-user-select:none;}
button{font-family:inherit;color:inherit;}
button:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.px,[class*=" A-"],[class^="A-"]{image-rendering:pixelated;}

/* ---------- 场景 ---------- */
#stage{position:absolute;overflow:hidden;background:var(--bg-deep);z-index:1;box-shadow:0 0 60px rgba(0,0,0,.8);}
.bgl{position:absolute;image-rendering:pixelated;background-size:100% 100%;background-repeat:no-repeat;opacity:0;transition:opacity 1.2s ease;}
.bgl.on{opacity:1;}
.f-cold{filter:hue-rotate(180deg) saturate(.45) brightness(.72);}
.f-dark{filter:brightness(.62) saturate(.85);}
.f-dim{filter:brightness(.72) saturate(.8);}
.f-dawn{filter:brightness(1.18) sepia(.32);}
.f-warm{filter:sepia(.3) brightness(.92);}
#sprites{position:absolute;inset:0;}
.spr{position:absolute;image-rendering:pixelated;background-size:100% 100%;background-repeat:no-repeat;background-color:transparent;border:0;padding:0;margin:0;transition:opacity .32s ease,transform .32s ease,filter .3s;}
.spr.spr-in{opacity:0;}
.spr.actor.por.spr-in{transform:translateY(calc(18px*var(--s)));}
.spr.actor.chr.spr-in{transform:translateX(calc(-10px*var(--s)));}
.spr.late{transition-delay:.42s;}
.spr.gone{opacity:0;pointer-events:none;}
.spr.actor.por.gone{transform:translateY(calc(18px*var(--s)));}
.spr.actor{z-index:3;pointer-events:none;}
.spr.chr{background-size:calc(128px*var(--s)) calc(256px*var(--s));background-position:0 0;}
.spr.nightf{filter:url(#nightf);}
.spr.lit .half{position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,10,6,.74) 50%,rgba(255,186,110,.18) 50%);-webkit-mask-size:100% 100%;mask-size:100% 100%;}
.spr.main.talk{animation:bob .5s steps(2) infinite;}
@keyframes bob{50%{transform:translateY(calc(-1px*var(--s)));}}
button.spr.tool,button.spr.item{cursor:pointer;z-index:4;}
button.spr.tool:hover,button.spr.item:hover,button.spr.tool:focus-visible,button.spr.item:focus-visible{filter:brightness(1.25) drop-shadow(0 0 calc(1px*var(--s)) #ffd25a);outline:none;}
.spr.hlt{animation:hlt 1.4s ease-in-out infinite;}
@keyframes hlt{50%{filter:brightness(1.4) drop-shadow(0 0 calc(1.5px*var(--s)) #ffd25a);}}
.spr.hl,.hl{animation:hlg 1.2s ease-in-out infinite!important;}
@keyframes hlg{0%,100%{box-shadow:0 0 0 2px rgba(255,209,89,.95),0 0 0 4px rgba(176,38,41,.6);}50%{box-shadow:0 0 0 3px rgba(255,209,89,.4),0 0 14px 4px rgba(255,209,89,.55);}}
.spr.prop,.spr.notice{z-index:4;pointer-events:none;}
.doorbox{overflow:hidden;z-index:1;pointer-events:none;}
.walker{position:absolute;top:calc(56px*var(--s));left:0;width:calc(16px*var(--s));height:calc(32px*var(--s));background-size:calc(64px*var(--s)) calc(128px*var(--s));image-rendering:pixelated;opacity:.85;
  animation:wx var(--dur,6s) linear var(--delay,0s) infinite backwards,wf .66s steps(4) infinite;}
.walker.r{background-position-y:calc(-64px*var(--s));}
.walker.l{background-position-y:calc(-32px*var(--s));animation-name:wxl,wf;}
.walker.troop{filter:sepia(1) saturate(.6) hue-rotate(20deg) brightness(.8);}
.walker.once{animation:wx .9s linear 0s 1 both,wf .66s steps(4) infinite;opacity:.95;}
@keyframes wx{from{transform:translateX(calc(-18px*var(--s)));}to{transform:translateX(calc(100px*var(--s)));}}
@keyframes wxl{from{transform:translateX(calc(100px*var(--s)));}to{transform:translateX(calc(-18px*var(--s)));}}
@keyframes wf{from{background-position-x:0;}to{background-position-x:calc(-64px*var(--s));}}
.rainfx{position:absolute;inset:0;background:repeating-linear-gradient(104deg,rgba(210,220,240,.32) 0 1px,transparent 1px 9px);animation:rain .35s linear infinite;}
@keyframes rain{to{background-position:calc(-3px*var(--s)) calc(12px*var(--s));}}
.seals{z-index:3;pointer-events:none;}
.seals i{position:absolute;left:-10%;width:120%;top:45%;height:calc(7px*var(--s));background:#f2efe6;box-shadow:0 0 0 1px #9a958a;transform:rotate(38deg);}
.seals i+i{transform:rotate(-38deg);}
.shadowman{pointer-events:none;z-index:2;animation:sway 3s ease-in-out infinite;}
.shadowman i{position:absolute;left:calc(1.5px*var(--s));top:calc(8px*var(--s));width:calc(9px*var(--s));height:calc(60px*var(--s));background:rgba(13,13,18,.55);}
.shadowman::before{content:"";position:absolute;left:calc(1px*var(--s));top:0;width:calc(10px*var(--s));height:calc(10px*var(--s));border-radius:50%;background:rgba(13,13,18,.55);}
@keyframes sway{50%{transform:translateX(calc(2px*var(--s)));}}
.fx{pointer-events:none;z-index:6;}
.fx.predawn{background:rgba(20,30,60,.38);}
.fx.fire{background:radial-gradient(ellipse at 80% 35%,rgba(255,140,40,.45),rgba(255,80,20,.18) 45%,transparent 70%);animation:flick .18s steps(2) infinite;}
@keyframes flick{50%{opacity:.7;}}
.fx.dimfx{background:rgba(8,6,12,.36);}
.fx.warmfx{background:rgba(255,150,50,.1);}
.fx.darkfx{background:rgba(0,0,13,.42);}
.fx.lampglow{background:radial-gradient(circle at 64% 42%,rgba(255,200,120,.16),transparent 62%);}
.fx.bars{background:repeating-linear-gradient(90deg,transparent 0 calc(28px*var(--s)),rgba(0,0,0,.6) calc(28px*var(--s)) calc(31px*var(--s)));}
.fx.drip i{position:absolute;left:30%;top:0;width:calc(1.5px*var(--s));height:calc(4px*var(--s));background:#9fc1e0;border-radius:50%;animation:drip 1.1s linear infinite;}
.fx.drip i:nth-child(2){left:55%;animation-delay:.4s;} .fx.drip i:nth-child(3){left:75%;animation-delay:.8s;}
@keyframes drip{from{transform:translateY(0);opacity:.9;}to{transform:translateY(calc(85px*var(--s)));opacity:.2;}}
.shake #sprites .tool{animation:tshake .3s 3;}
@keyframes tshake{50%{transform:translateX(calc(1px*var(--s)));}}
#stage .droplabel{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);padding:10px 18px;border:2px dashed var(--gold);border-radius:10px;background:rgba(13,10,8,.78);color:var(--gold-3);font-size:16px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:9;white-space:nowrap;}
body.drag-card #stage .droplabel,body.drag-night #stage .droplabel{opacity:1;}
body.drag-card #stage,body.drag-night #stage{box-shadow:0 0 0 3px rgba(232,195,90,.5),0 0 60px rgba(0,0,0,.8);}
#stage.dropover{box-shadow:0 0 0 4px var(--gold),0 0 40px rgba(232,195,90,.45)!important;}

/* 柜台上的格子和铜钱 */
#checks{position:absolute;inset:0;pointer-events:none;z-index:8;font-size:max(10px,calc(3.2px*var(--s) + 1px));}
#checks .cslot{position:absolute;pointer-events:auto;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:2px;padding:4px 4px 5px;
  background:rgba(26,16,9,.82);border:2px dashed rgba(232,195,90,.75);border-radius:6px;box-shadow:inset 0 0 12px rgba(0,0,0,.6);color:var(--text);text-align:center;line-height:1.2;animation:slotin .3s ease both;}
@keyframes slotin{from{opacity:0;transform:translateY(8px);}}
#checks .cslot.full{border-style:solid;background:rgba(58,40,22,.9);}
.cslot .sl,.wslot .sl{font-size:.82em;color:var(--gold);letter-spacing:.02em;}
.cslot .sv,.wslot .sv{font-size:.9em;}
.cslot .sfill{display:flex;align-items:center;gap:4px;justify-content:center;}
.sface{display:inline-block;width:1.9em;height:2.5em;background-size:100% 100%;image-rendering:pixelated;flex:none;}
.skept{display:inline-flex;width:1.5em;height:1.5em;border-radius:50%;background:var(--seal);color:var(--seal-ink);align-items:center;justify-content:center;font-family:var(--f-brush);font-style:normal;flex:none;}
.cslot .spick,.cslot .sx,.cslot .sbtn,.wslot .spick,.wslot .sx,.wslot .sbtn{font-size:.85em;padding:2px 6px;border-radius:4px;border:1px solid var(--line);background:var(--wood-2);cursor:pointer;color:var(--text);}
.cslot .spick:hover,.cslot .sx:hover,.cslot .sbtn:hover:not(:disabled),.wslot button:hover:not(:disabled){background:var(--umber);}
.cslot .sb,.wslot .sb{display:flex;gap:4px;}
.sbtn:disabled{opacity:.4;cursor:not-allowed;}
.cslot.dropover,.wslot.dropover{border-color:#fff0b8;background:rgba(120,90,30,.85);transform:scale(1.04);}
body.drag-p .cslot.t-person:not(.full),body.drag-kept .cslot.t-kept:not(.full),body.drag-p .wslot.t-person:not(.full),body.drag-kept .wslot.t-kept:not(.full){box-shadow:0 0 0 2px rgba(255,240,184,.7),0 0 16px rgba(232,195,90,.6);}
#checks .coin{position:absolute;display:block;background-size:100% 100%;image-rendering:pixelated;filter:drop-shadow(0 calc(1px*var(--s)) 0 rgba(0,0,0,.5));}
#checks .coin.idle{opacity:.55;filter:grayscale(.3) drop-shadow(0 calc(1px*var(--s)) 0 rgba(0,0,0,.5));}
#checks .coin.auto{opacity:.9;box-shadow:0 0 0 2px var(--gold);border-radius:50%;}
#checks .coin b{position:absolute;inset:0;background-size:100% 100%;image-rendering:pixelated;}
#checks .coin.flip .cf{opacity:0;animation:cface .01s linear calc(.86s + var(--i)*70ms) forwards;}
#checks .coin.flip .cs{animation:cspin .86s ease-out calc(var(--i)*70ms) both;}
#checks .coin.flip{animation:cjump .86s ease-out calc(var(--i)*70ms) both;}
@keyframes cface{to{opacity:1;}}
@keyframes cspin{0%{transform:scaleX(1);}12%{transform:scaleX(.1);}25%{transform:scaleX(1);filter:brightness(.6);}37%{transform:scaleX(.1);}50%{transform:scaleX(1);}62%{transform:scaleX(.1);filter:brightness(.6);}75%{transform:scaleX(1);}88%{transform:scaleX(.1);}99%{opacity:1;}100%{transform:scaleX(1);opacity:0;}}
@keyframes cjump{0%{transform:translateY(0);}35%{transform:translateY(-160%);}70%{transform:translateY(-30%);}85%{transform:translateY(-55%);}100%{transform:translateY(0);}}
#checks .nocoin{position:absolute;display:flex;align-items:center;justify-content:center;font-size:.8em;color:var(--text-2);text-shadow:0 1px 2px #000;}

/* ---------- 顶部 HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;height:30px;z-index:38;display:flex;align-items:center;gap:14px;padding:0 54px 0 14px;box-sizing:border-box;
  background:linear-gradient(rgba(13,9,6,.94),rgba(13,9,6,.78));border-bottom:1px solid rgba(232,195,90,.25);font-size:13px;white-space:nowrap;overflow:hidden;}
#hud.off{display:none;}
#hud .brand{font-family:var(--f-brush);font-size:20px;color:var(--gold);letter-spacing:.08em;}
#hud .hdate b{font-weight:600;color:var(--text);} #hud .hdate small{margin-left:8px;color:var(--text-2);font-size:12px;}
#hud .hsp{flex:1;}
#hud button{background:transparent;border:0;cursor:pointer;padding:2px 6px;border-radius:4px;font-size:13px;display:inline-flex;align-items:center;gap:6px;}
#hud button:hover{background:rgba(232,195,90,.12);}
#hud i{display:inline-block;width:16px;height:16px;background-size:100% 100%;image-rendering:pixelated;}
#hud .halm i{width:12px;height:17px;}
.yi{color:#9fd38f;} .ji{color:#f0907a;} .fo{color:var(--gold);font-size:12px;}
.hmoney b{font-size:15px;color:var(--gold-3);} .hmoney.neg b{color:var(--bad);}
.hstats{display:inline-flex;gap:12px;} .htier{color:var(--text-2);font-size:12.5px;} .htier b{color:var(--text);font-weight:600;}
.htier.h2 b{color:var(--warn);} .htier.h3 b,.htier.h4 b{color:var(--bad);}
.hwarn{color:#fff;background:var(--seal-2);padding:1px 8px;border-radius:3px;font-size:12px;}
#hud.m{height:40px;flex-direction:column;align-items:stretch;justify-content:center;gap:1px;padding:0 8px;font-size:11.5px;}
#hud.m .hrow{display:flex;align-items:center;gap:8px;justify-content:space-between;}
#hud.m .hdate{flex:1;overflow:hidden;text-overflow:ellipsis;} #hud.m button{padding:0 4px;font-size:11.5px;}
#hud.m .hstats{gap:8px;} #hud.m .htier{font-size:11px;}

/* ---------- 对话框 ---------- */
.dlg{position:absolute;z-index:20;box-sizing:border-box;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;}
.dlg.off{display:none;}
.dlg.on,.dlg.idle{background:rgba(20,12,7,.93);border:14px solid transparent;border-radius:2px;padding:6px 10px 10px;box-shadow:0 12px 30px rgba(0,0,0,.6);}
.dlg.on{display:flex;flex-direction:column;overflow:hidden;}
.dlg.on>.dskip{align-self:flex-end;margin-bottom:-22px;}
.dlg.on>.dprev,.dlg.on>.dline{flex:none;}
.dlg.on>.dreply{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;}
.dlg.idle{background:rgba(20,12,7,.72);}
.dlg.gold{box-shadow:0 0 0 2px rgba(232,195,90,.6),0 0 24px rgba(232,195,90,.35),0 12px 30px rgba(0,0,0,.6);}
.dskip{margin:0 0 0 8px;background:transparent;border:1px solid var(--line);border-radius:3px;color:var(--text-3);font-size:11.5px;padding:1px 8px;cursor:pointer;position:relative;z-index:2;}
.dskip:hover{color:var(--gold-3);border-color:var(--gold-2);}
.dprev{font-size:13px;color:var(--text-3);padding:2px 0 6px;border-bottom:1px dashed var(--line);margin-bottom:6px;}
.dprev b{color:var(--text-2);margin-right:8px;font-weight:600;}
.dline{position:relative;cursor:pointer;padding:2px 2px 18px;min-height:92px;outline:none;}
.dline:focus-visible{box-shadow:0 0 0 2px var(--focus);}
.dline .dface{position:absolute;left:0;top:4px;width:48px;height:64px;background-size:100% 100%;image-rendering:pixelated;border:2px solid var(--line);background-color:#2b1c12;}
.dline .dface~.dname,.dline .dface~.dtext{margin-left:60px;}
.dname{min-height:26px;display:flex;align-items:baseline;gap:8px;}
.dname b{font-family:var(--f-brush);font-size:24px;font-weight:400;color:var(--gold);line-height:1.1;}
.dname small{font-size:12px;color:var(--text-3);}
.dname .sysn{color:var(--text-3);}
.k-me .dname b{color:#a9cdf0;}
.dtext{font-size:17.5px;line-height:1.75;color:#f5e9cf;white-space:pre-wrap;word-break:break-word;}
.k-narr .dtext{color:#d7c6a0;font-size:16.5px;}
.k-sys .dname{display:none;} .k-sys .dtext{font-size:15px;color:var(--gold);letter-spacing:.14em;text-align:center;padding:10px 0 0;}
.dmore{position:absolute;right:4px;bottom:0;font-size:13px;color:var(--gold);animation:blink 1.1s steps(2) infinite;}
@keyframes blink{50%{opacity:.3;}}
.dreply{border-top:1px solid var(--line);padding-top:8px;margin-top:2px;animation:fadein .2s ease both;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}}
.replies{display:flex;flex-direction:column;gap:2px;}
.reply{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;text-align:left;background:transparent;border:0;border-radius:3px;color:var(--text);font-size:15.5px;line-height:1.45;padding:6px 8px;cursor:pointer;}
.reply:hover:not(:disabled),.reply:focus-visible{background:rgba(232,195,90,.15);color:var(--gold-3);}
.reply .rb{color:var(--gold);flex:none;width:14px;}
.reply .rt{flex:1;min-width:0;}
.reply .why{flex-basis:100%;padding-left:22px;font-size:12px;color:var(--text-3);}
.reply:disabled{opacity:.5;cursor:not-allowed;}
.reply.roll .rt{color:var(--focus);font-weight:700;}
.reply.ap .rt{color:#cfe0c0;}
.reply.minor{color:var(--text-3);font-size:13.5px;}
.rnote{font-size:12.5px;color:var(--text-2);padding:2px 8px 4px 30px;line-height:1.5;}
.rnote.gold{color:#f1d27a;padding-left:8px;}
.rnote .warn{color:var(--bad);}
.rinfo{display:flex;gap:10px;align-items:center;padding:4px 8px 6px;}
.rinfo .rimg{flex:none;width:48px;height:48px;background-size:100% 100%;image-rendering:pixelated;background-color:rgba(233,220,184,.1);border-radius:4px;}
.rinfo b{display:block;font-size:14.5px;} .rinfo span{font-size:12px;color:var(--text-2);}
.rclues{list-style:none;margin:0 0 6px;padding:6px 10px;background:rgba(233,220,184,.07);border-left:3px solid var(--gold-2);font-size:13px;line-height:1.55;color:var(--text-2);}
.rclues b{color:var(--gold);margin-right:6px;font-weight:600;}
.didle p{margin:0 0 6px;font-size:14.5px;line-height:1.6;color:var(--text-2);}
.didle ul{margin:0;padding-left:18px;font-size:12.5px;color:var(--text-3);line-height:1.5;}
#app.m .dlg.on,#app.m .dlg.idle{border-width:10px;padding:4px 8px 8px;}
#app.m .dline{min-height:0;padding-bottom:16px;} #app.m .dprev{padding-bottom:3px;margin-bottom:3px;}
#app.m .dname b{font-size:20px;} #app.m .dtext{font-size:15.5px;line-height:1.65;} #app.m .reply{font-size:14.5px;padding:7px 6px;}

/* ---------- 手牌 ---------- */
#hand{position:absolute;left:0;right:0;bottom:0;height:0;z-index:30;transition:opacity .4s,transform .4s;}
#hand.away{opacity:0;transform:translateY(80px);pointer-events:none;}
#hand .card{position:absolute;}
.card{box-sizing:border-box;border-radius:9px;background:linear-gradient(#f1e5c4,#dcc79a);border:3px solid var(--fr,#6b4a2e);
  box-shadow:0 6px 14px rgba(0,0,0,.55),inset 0 0 0 2px rgba(255,255,255,.28);color:var(--ink);--fr:#6b4a2e;--lift:150px;
  transform-origin:50% 140%;transform:translate(var(--x),var(--y)) rotate(var(--r));transition:transform .18s ease,box-shadow .18s ease,opacity .2s;z-index:var(--z);
  cursor:grab;touch-action:none;display:flex;flex-direction:column;align-items:center;padding:5px 6px 8px;overflow:hidden;}
#app.d #hand .card:hover,#hand .card:focus-visible,#hand .card.sel{transform:translate(var(--x),calc(var(--lift)*-1)) rotate(0deg) scale(1.34);z-index:60;box-shadow:0 18px 34px rgba(0,0,0,.72),0 0 0 2px var(--focus);}
#hand.low .card:not(:hover):not(.sel){transform:translate(var(--x),calc(var(--y) + 46px)) rotate(var(--r));}
#hand.low .card.k-kept:not(:hover):not(.sel){transform:translate(var(--x),calc(var(--y) + 10px)) rotate(var(--r));box-shadow:0 0 0 2px var(--gold),0 0 14px rgba(232,195,90,.6);}

#nextday{position:absolute;z-index:85;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;
  border-radius:16px;border:3px solid #3a2412;background:radial-gradient(ellipse at 50% 35%,#ffe08a,#d9a53c 55%,#8a5c18);color:#2a1606;
  box-shadow:0 0 0 3px rgba(232,195,90,.35),0 10px 24px rgba(0,0,0,.65),inset 0 2px 0 rgba(255,255,255,.4);font-family:var(--f-brush);transition:transform .12s,filter .12s;}
#nextday:hover{transform:scale(1.04);filter:brightness(1.08);}
#nextday:active{transform:scale(.98);}
#nextday .etl{font-size:26px;line-height:1.05;white-space:nowrap;}
#nextday small{font-family:var(--f-body);font-size:12px;color:#4a2c0a;white-space:nowrap;}
#nextday.ready{background:radial-gradient(ellipse at 50% 35%,#c8f0a0,#7fbf4a 55%,#3f6a1c);animation:etglow 1.6s ease-in-out infinite;}
#nextday.ready small{color:#1f3a0c;}
#nextday.confirm{background:radial-gradient(ellipse at 50% 35%,#ff9a7a,#c8452c 55%,#6e1a0e);color:#fff4e8;} #nextday.confirm small{color:#ffe0d0;}

#overlay,#picker{position:absolute;inset:0;z-index:60;display:none;}

.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,5,3,.62);padding:16px;box-sizing:border-box;animation:ovin .22s ease both;}
.ov.noanim{animation:none;}
@keyframes ovin{from{opacity:0;}}
.modal{position:relative;background:linear-gradient(#2a1c12,#1e140d);border:3px solid var(--umber);border-radius:8px;box-shadow:0 0 0 1px #000,0 20px 50px rgba(0,0,0,.75);max-width:680px;width:100%;max-height:calc(100% - 24px);overflow-y:auto;padding:20px 24px;box-sizing:border-box;overscroll-behavior:contain;}
.modal h2{margin:0 0 6px;font-family:var(--f-brush);font-weight:400;font-size:30px;color:var(--gold);}
.modal h3{margin:14px 0 6px;font-size:16px;color:var(--gold);}

.tbig{font-family:var(--f-brush);font-size:112px;line-height:1.1;color:var(--gold);text-shadow:0 4px 0 #3a2412,0 0 30px rgba(232,195,90,.35);}

.seedrow{display:flex;gap:8px;align-items:center;margin:14px 0;} .seedrow label{color:var(--text-2);}

.ledgerbook{background:linear-gradient(#efe2bf,#dcc79a);color:var(--ink);border-color:#3a5070;}
.ledgerbook h2{color:var(--seal-2);} .ledgerbook .sub,.ledgerbook .statgrid dt{color:var(--ink-3);} .ledgerbook .pos{color:#2f6b2a;} .ledgerbook .neg{color:var(--seal-2);}

.wheel-ov{background:#0d0a08;}

.wbox{position:relative;display:flex;gap:24px;align-items:center;max-width:1040px;width:100%;max-height:100%;}
.wl{flex:none;}
.wheel{position:relative;width:min(56vh,40vw,520px);aspect-ratio:1;}
.wheel canvas{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 0 0 8px #3a2412,0 0 0 11px var(--gold-2),0 20px 50px rgba(0,0,0,.7);}
.wheel .ptr{position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:34px solid var(--seal);z-index:2;filter:drop-shadow(0 3px 2px rgba(0,0,0,.6));}

.altar-title{font-family:var(--f-brush);color:var(--gold);font-size:20px;margin:6px 0;}

.wmsg{margin:12px 0;font-size:16px;color:var(--gold-3);animation:blink 1s steps(2) infinite;}

.simg{position:relative;background-size:100% 100%;image-rendering:pixelated;background-color:#e9dcb8;border:3px solid var(--umber);border-radius:4px;box-shadow:inset 0 0 20px rgba(0,0,0,.25);}

.hint{color:var(--text-2);font-size:14px;margin:6px 0;}

/* ===================== 德厚当 · 牌桌试玩 · 游戏逻辑 =====================
   与界面分离：new Game(seed) / g.s（state）/ g.actions() / g.apply(a) / g.toJSON() / Game.load(json)
   所有随机都来自带种子的 mulberry32，按（种子|天|用途）取流：同种子、同样的操作，结果一样。 */
'use strict';

function xmur3(str){ let h=1779033703^str.length; for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=(h<<13)|(h>>>19); } return function(){ h=Math.imul(h^(h>>>16),2246822507); h=Math.imul(h^(h>>>13),3266489909); return (h^=h>>>16)>>>0; }; }
function mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
class Rng{
  constructor(key){ this.f=mulberry32(xmur3(String(key))()); }
  next(){ return this.f(); }
  int(n){ return Math.floor(this.f()*n); }
  range(a,b){ return a+this.int(b-a+1); }
  chance(p){ return this.f()<p; }
  pick(a){ return a[this.int(a.length)]; }
  wpick(list,w){ let tot=0; for(const x of list) tot+=Math.max(0,w(x)); if(tot<=0) return list[this.int(list.length)]; let r=this.f()*tot; for(const x of list){ r-=Math.max(0,w(x)); if(r<0) return x; } return list[list.length-1]; }
  shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=this.int(i+1); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
}

  sellItem(c,it,price,tier){ const s=this.s, n=P[c.p].name;

  appraise(c,how,score,reading){ const it=c.item, r=this.rng(c.uid+'|ap|'+how); score=clamp(+score||0,0,1);

      text=`戥子上读得 ${fmtQian(rd)}，${P[c.p].name}说是 ${fmtQian(c.claim)}。`; if(score<0.5) text+='秤杆没平，这个数靠不太住。'; }

  /* ---- 算命 ---- */
  drawQian(c){ const s=this.s, d=s.day; const r=this.rng(c.uid+'|qian'); const days=[d+1,d+2,d+3].filter(x=>x<=MAX_DAY);
    if(!days.length){ const q={day:d,grade:'中签',lines:['月尽了，好坏都在账上。'],until:d}; s.qian.push(q); this.frag('suanming','他给你求了一支签：月尽了。'); return `中签：月尽了，好坏都在账上。`; }
    const low=s.heart<35, cands=[];
    for(const day of days){ const sched=this.scheduledEvent(day); const pe=(s.pinned[day]||[]).find(x=>x.kind==='event');
      if(pe) cands.push({day,def:pe.def,kind:'event',already:true}); else if(sched) cands.push({day,def:sched,kind:'event',already:true}); else cands.push({day,def:this.pickEvent(new Rng(s.seed+'|'+day+'|qe'),day),kind:'event'});

    const nPick=Math.min(order.length,r.chance(0.5)?2:1); const picks=order.slice(0,nPick);
    for(const p of picks){ if(!p.already) this.pin(p.day,{kind:p.kind,def:p.def}); }
    const lines=picks.map(p=>{ const om=(D[p.def].omen||[])[0]||'人'; return OMEN_QIAN[om]||OMEN_QIAN['人']; });
    const nb=picks.filter(bad).length; const grade=nb===picks.length?'下签':nb===0?'上签':'中签';
    s.qian.push({day:d,grade,lines,until:days[days.length-1]});

    return `${grade}：${lines.join(' ')}（说的是往后三天）`; }
  testZi(c,ch){ const s=this.s, d=s.day; const days=[d+1,d+2,d+3].filter(x=>x<=MAX_DAY); let yes=false;

  /* ---- 条子 ---- */
  noteOpts(c){ const s=this.s, L=[]; if(c.done) return L; const t=c.tier;
    if(c.cat==='money'){ L.push({id:'pay',label:`交 ${CONFIG.note.money[t]} 蚨`,dis:s.money<CONFIG.note.money[t]?'钱不够':null}); if(this.keptByK('gold_bar')) L.push({id:'bar',label:'交一根金条'}); }
    if(c.cat==='goods'){ for(const it of s.shelf.filter(i=>i.cat===c.want&&this.market(i)>=CONFIG.note.goods[t])) L.push({id:'give:'+it.uid,label:`交出${it.name}`}); const alt=Math.round(CONFIG.note.goods[t]*CONFIG.note.goodsCashMul); L.push({id:'payalt',label:`折成钱：${alt} 蚨`,dis:s.money<alt?'钱不够':null}); }
    if(c.cat==='person'){ L.push({id:'send:me',label:'你自己去出夫（明天铺子关一天）'}); for(const pid of s.contacts) if(!s.away[pid]) L.push({id:'send:'+pid,label:`让${P[pid].name}去（${CONFIG.note.away[t]} 天不在${t>=3?'，可能回不来':''}）`}); L.push({id:'payalt',label:`花钱顶替：${CONFIG.note.personPay[t]} 蚨`,dis:s.money<CONFIG.note.personPay[t]?'钱不够':null}); }
    if(c.cat==='info'){ for(const k of s.kept.filter(k=>KEPT[k.k].type==='消息')) L.push({id:'tell:'+k.uid,label:`交出“${KEPT[k.k].name}”`});
      const named=DOSSIER_ORDER.filter(pid=>!P[pid].arche&&pid!=='brother'&&pid!=='hu2'&&pid!=='ma'&&s.dossier[pid]&&s.dossier[pid].frags.length&&!s.dossier[pid].broken).slice(0,4);
      for(const pid of named) L.push({id:'name:'+pid,label:`说出${P[pid].name}常来`});
      L.push({id:'fake',label:'编一个（掷胆量）',dis:c.fakeTried?'已经编过了':null}); }
    L.push({id:'delay',label:'拖一拖（加三天，升一档）',dis:c.delayed?'已经拖过一次':t>=3?'已经是最高一档':null});
    return L; }
  noteChoose(c,id){ const s=this.s, t=c.tier; const ok=txt=>{ c.done=true; c.ok=true; s.stats.notesOk++; this.frag('hu2',`条子（${NOTE_CAT[c.cat]}）办了。`); return txt; };
    if(id==='pay'){ if(s.money<CONFIG.note.money[t]) return {stay:true,text:'钱不够。'}; this.money(-CONFIG.note.money[t],'条子'); return ok(`交了 ${CONFIG.note.money[t]} 蚨。胡二在小折子上勾了一笔。`); }
    if(id==='bar'){ const k=this.keptByK('gold_bar'); if(!k) return {stay:true,text:''}; this.loseKept(k.uid); return ok('交了一根金条。胡二眼睛都亮了。'); }

    if(id==='payalt'){ const amt=c.cat==='goods'?Math.round(CONFIG.note.goods[t]*CONFIG.note.goodsCashMul):CONFIG.note.personPay[t]; if(s.money<amt) return {stay:true,text:'钱不够。'}; this.money(-amt,'条子折钱'); return ok(`折了 ${amt} 蚨。`); }

      s.away[pid]=CONFIG.note.away[t]; if(t>=3&&this.rng(c.uid+'|away').chance(0.5)){ s.contacts=s.contacts.filter(x=>x!==pid); delete s.away[pid]; this.frag(pid,'被你派去修工事，没回来。'); return ok(`${P[pid].name}去了，没回来。`); }

  /* ---- 格子与铜钱 ---- */
  slotsOf(c){ if(c.done) return []; const d=D[c.def]; if(!d||!d.slots) return []; return typeof d.slots==='function'?d.slots(this,c):d.slots; }
  needOf(c){ const d=D[c.def]; return typeof d.need==='function'?d.need(this,c):(d.need||1); }
  reserved(except){ const res={money:0,kept:new Set(),people:new Set(),items:new Set()};
    for(const c of this.allCards()){ if(c.done) continue; for(const k in c.fill){ const f=c.fill[k]; if(!f) continue; if(f.k==='money') res.money+=f.n; if(f.k==='kept') res.kept.add(f.uid); if(f.k==='p') res.people.add(f.id); if(f.k==='item') res.items.add(f.uid); } }
    return res; }
  freeMoney(){ return this.s.money-this.reserved().money; }
  people(){ return ['me'].concat(this.s.contacts); }
  eligible(c,sl){ const s=this.s, res=this.reserved(), out=[];
    if(sl.type==='person'){ let pool=this.people(); if(sl.who==='contact') pool=s.contacts.slice(); if(sl.who==='me') pool=['me'];
      for(const pid of pool) if(!s.busy[pid]&&!(s.away[pid]>0)&&!res.people.has(pid)) out.push({k:'p',id:pid}); }
    if(sl.type==='money'){ const free=s.money-res.money; for(let i=1;i<=sl.max;i++){ if(sl.unit*i<=free) out.push({k:'money',n:sl.unit*i}); } }
    if(sl.type==='kept'){ for(const k of s.kept) if(!res.kept.has(k.uid)&&(!sl.tags.length||KEPT[k.k].tags.some(t=>sl.tags.includes(t)))) out.push({k:'kept',uid:k.uid}); }
    if(sl.type==='item'){ for(const it of s.shelf) if(!res.items.has(it.uid)&&(!sl.cat||it.cat===sl.cat)) out.push({k:'item',uid:it.uid}); }
    return out; }
  refOk(c,sl,ref){ if(!ref) return false; if(ref.k==='money'){ const free=this.freeMoney(); return sl.type==='money'&&ref.n>=sl.unit&&ref.n<=sl.unit*sl.max&&ref.n<=free; } return this.eligible(c,sl).some(e=>e.k===ref.k&&(e.id||e.uid)===(ref.id||ref.uid)); }
  coinsOf(c){ let coins=0,auto=0,pass=false; for(const sl of this.slotsOf(c)){ const f=c.fill[sl.id]; if(!f||sl.bet) continue;
      if(f.k==='p') coins+=this.attr(f.id,sl.attr);
      if(f.k==='money') coins+=Math.min(sl.max,Math.floor(f.n/sl.unit));
      if(f.k==='kept'){ const k=this.s.kept.find(x=>x.uid===f.uid); if(k){ const K=KEPT[k.k]; if(K.passes&&K.passes.includes(c.def)) pass=true; auto+=K.auto||0; } }
      if(f.k==='item'){ const it=this.s.shelf.find(x=>x.uid===f.uid); if(it) coins+=1+(it.base>=80?1:0); } }
    return {coins,auto,pass}; }
  consumeFills(c,isJail){ const s=this.s; for(const sl of this.slotsOf(c)){ const f=c.fill[sl.id]; if(!f||sl.bet) continue;
      if(f.k==='money') this.money(-f.n,'格子里花的钱');
      if(f.k==='kept'){ const k=s.kept.find(x=>x.uid===f.uid); if(k&&(!KEPT[k.k].stay||isJail)) this.loseKept(k.uid); }
      if(f.k==='p') s.busy[f.id]=true;
      if(f.k==='item') this.removeItem(f.uid); }
    c.fill={}; }
  roll(c){ const s=this.s, d=D[c.def]; const {coins,auto,pass}=this.coinsOf(c); const need=this.needOf(c);
    const me=Object.values(c.fill).some(f=>f&&f.k==='p'&&f.id==='me'); const meAttrs=this.slotsOf(c).filter(sl=>c.fill[sl.id]&&c.fill[sl.id].k==='p'&&c.fill[sl.id].id==='me').map(sl=>sl.attr);
    const r=this.rng(c.uid+'|roll|'+(c.rolls=(c.rolls||0)+1)); const faces=[]; for(let i=0;i<coins;i++) faces.push(r.next()<0.5);

    this.finish(c,res); }

  /* ---- 轮盘 ---- */
  wheelOf(c){ const d=D[c.def]; const secs=WHEELS[d.wheel].filter(x=>!x.cond||x.cond(this)); const units=this.altarUnits(c); const good=secs.filter(x=>x.cls==='good').length||1;
    const W=CONFIG.wheels[d.wheel]; const widths=secs.map(x=>W[x.id]+(x.cls==='good'?units*CONFIG.altarPerUnit/good:0)); return {secs,widths,units}; }
  altarUnits(c){ let u=0; for(const sl of this.slotsOf(c)){ const f=c.fill[sl.id]; if(!f||sl.bet) continue; if(f.k==='money') u+=Math.min(sl.max,Math.floor(f.n/sl.unit)); if(f.k==='kept') u+=3; if(f.k==='p') u+=1+this.attr(f.id,'road'); } return u; }
  spinFee(c){ return CONFIG.wheelFee[D[c.def].wheel]||0; }
  spinModes(c){ const d=D[c.def]; if(c.done||!d.wheel) return []; if(d.wheel==='fortune'||d.wheel==='big') return ['free']; if(c.st!=='wheel') return [];
    const m=[]; if(this.freeMoney()>=this.spinFee(c)) m.push('pay'); if(c.fill.bet) m.push('bet'); return m; }
  spin(c,mode){ const s=this.s, d=D[c.def]; if(!this.spinModes(c).includes(mode)) return false;
    const {secs,widths}=this.wheelOf(c); const tot=widths.reduce((a,b)=>a+b,0); const r=this.rng(c.uid+'|spin').next(); let x=r*tot, idx=0; for(;idx<widths.length;idx++){ x-=widths[idx]; if(x<0) break; } idx=Math.min(idx,secs.length-1);
    c.spin={idx,widths,ids:secs.map(z=>z.id),labels:secs.map(z=>z.label),cls:secs.map(z=>z.cls),at:r};
    let bet=null; if(mode==='bet'){ const k=s.kept.find(x=>x.uid===c.fill.bet.uid); bet=k||null; }
    if(mode==='pay') this.money(-this.spinFee(c),d.wheel==='temple'?'香火钱':'赌注');
    this.consumeFills(c,false); s.stats.spins++; if(d.wheel!=='fortune'&&d.wheel!=='big') s.df.bet=true;
    const res=d.onSpin(this,c,secs[idx],mode,bet); this.finish(c,res); return true; }
  templeResult(c,sec,mode,bet){ const b=!!bet; let t=`转到“${sec.label}”。`;
    if(sec.id==='daji'){ this.money(b?100:60,'庙会大吉'); this.rep(2); t+=b?'押的牌还在，又得了一百 蚨。':'得了六十 蚨。'; }
    if(sec.id==='xiaoji'){ this.money(b?40:20,'庙会小吉'); this.rep(3); t+=b?'押的牌还给你，另得四十。':'得了二十 蚨，口碑涨了一点。'; }
    if(sec.id==='ping') t+=b?'押的牌还给你。':'什么也没发生。';
    if(sec.id==='an'){ this.heat(-6); t+='风声小了一点。'+(b?'押的牌还给你。':''); }
    if(sec.id==='po'){ if(b){ this.loseKept(bet.uid); t+=`押的“${KEPT[bet.k].name}”没了。`; } else { this.money(-20,'庙会破财'); t+='又破了二十 蚨。'; } }
    if(sec.id==='shi'){ if(b){ this.loseKept(bet.uid); t+=`押的“${KEPT[bet.k].name}”没了。`; } else t+=this.loseRandom(this.rng(c.uid+'|shi'),'在人堆里丢了'); }
    return t; }
  gambleResult(c,sec,mode,bet){ const b=!!bet; let t=`转到“${sec.label}”。`;
    if(sec.id==='win2'){ this.money(b?80:50,'赌摊'); t+=b?'押的牌还在，赢了八十。':'赢了五十。'; }
    if(sec.id==='win'){ this.money(b?35:20,'赌摊'); t+=b?'押的牌还在，赢了三十五。':'赢了二十。'; }
    if(sec.id==='even') t+=b?'押的牌还给你。':'本钱还给你。';
    if(sec.id==='even'&&!b) this.money(20,'赌摊退本');

  bigResult(c,sec){ const s=this.s, cr=c.crisis; let t=`大轮盘转到“${sec.label}”。`;

    if(sec.id==='calm'){ this.heat(-10); if(s.jail) s.jail.need=Math.max(1,s.jail.need-1); t+='虚惊一场。'+(s.jail?'牢里的人说话松了点。':'风声小了些。'); }

    return t; }

  /* ---- 牢房 ---- */
  release(c){ const s=this.s; s.jail=null; s.heat=Math.min(s.heat,CONFIG.jail.releaseHeatCap); for(const pid of s.contacts) if(s.busy[pid]){ s.away[pid]=2; this.frag(pid,'替你作保，把你从牢里弄了出来。'); } this.log('从牢里出来了。'); }

  gameOver(kind){ const s=this.s; s.phase='over'; s.ending={kind,text:kind==='jail'?'没疏通成。德厚当的门板一直没有卸下来。':'关得太久了。德厚当的门板一直没有卸下来。'}; s.review=this.makeReview(); }

  /* ---- 家当 ---- */
  canMortgage(k){ const a=this.s.assets[k]; return this.s.phase==='day'&&!a.m&&!a.lost; }
  canRedeem(k){ const a=this.s.assets[k]; return this.s.phase==='day'&&a.m&&!a.lost&&this.freeMoney()>=this.assetRedeemCost(k); }
  assetRedeemCost(k){ return Math.round(ASSETS[k].value*CONFIG.assetRedeemMul); }
  mortgage(k){ const s=this.s; s.assets[k].m=true; this.money(ASSETS[k].value,`押出去：${ASSETS[k].name}`); s.df.mortgage=true; this.teach('mortgage'); this.log(`${ASSETS[k].name}押出去了，换了 ${ASSETS[k].value} 蚨。${ASSETS[k].loss}。`); this.checkStreet(); }
  redeemAsset(k){ const s=this.s; const cost=this.assetRedeemCost(k); this.money(-cost,`赎回：${ASSETS[k].name}`); s.assets[k].m=false; this.log(`${ASSETS[k].name}赎回来了，花了 ${cost} 蚨。`); if(s.street){ s.street=false; s.streetDays=0; this.log('铺子重新开了门。明天起照常营业。'); } }
  checkStreet(){ const s=this.s; if(ASSET_ORDER.every(a=>s.assets[a].m||s.assets[a].lost)&&!s.street){ s.street=true; s.streetDays=0; this.teach('street'); this.log('家当押光了。明天起只能上街。'); } }

  /* ---- 留着的牌：打出 ---- */
  playDis(k,id){ const s=this.s; if(id==='read'&&s.flags.noteRead) return '已经看过了'; if(id==='sign'&&s.assets.laozhai.lost) return '老宅已经没了'; return null; }
  play(k,id){ const s=this.s, K=KEPT[k.k];
    if(k.k==='gold_bar'&&id==='sell'){ this.loseKept(k.uid); this.money(180,'金条卖给银楼'); return '金条换了一百八十 蚨。'; }
    if(k.k==='house_offer'&&id==='sign'){ this.loseKept(k.uid); const a=s.assets.laozhai; let t='签了字。老宅归了别人，'; if(a.m){ this.money(450-this.assetRedeemCost('laozhai'),'卖老宅（还清抵押）'); t+='还清了抵押，'; } else this.money(450,'卖老宅'); a.m=false; a.lost=true; this.heart(-4); this.checkStreet(); return t+'一家人搬进了铺子后间。'; }
    if(k.k==='ship_ticket'&&id==='sell'){ this.loseKept(k.uid); this.money(120,'转手船票'); return '船票转手卖了一百二十 蚨。'; }
    if(k.k==='ship_ticket'&&id==='go'){ this.loseKept(k.uid); s.phase='end'; s.ending={kind:'ship',text:'你上了去上海的船。德厚当的钥匙交给了周妈。'}; s.review=this.makeReview(); return '你上了船。'; }
    if(k.k==='watch_note'&&id==='read'){ s.flags.noteRead=true; this.frag('stranger','怀表里的纸条：“三月廿八，南京。”后面是一串数字。'); this.frag('brother','纸条上的字，有一个像哥哥写的。'); return '纸条上写着：“三月廿八，南京。”后面是一串数字。'; }
    return ''; }

  /* ---- 动作表 ---- */
  actions(){ const s=this.s, A=[];
    if(s.phase==='day'){
      for(const c of this.allCards()){ if(c.done) continue; this.cardActions(c,A); }
      for(const k of s.kept) for(const p of (KEPT[k.k].plays||[])) if(!this.playDis(k,p.id)) A.push({t:'play',uid:k.uid,id:p.id});
      for(const k of ASSET_ORDER){ if(this.canMortgage(k)) A.push({t:'mortgage',id:k}); if(this.canRedeem(k)) A.push({t:'redeem',id:k}); }
      A.push({t:'close'});
    } else if(s.phase==='night'){ for(const id of s.nightOffer) if(!this.nightDis(id)) A.push({t:'night',id}); A.push({t:'night',id:'none'}); }
    else { A.push({t:'restart',same:true}); A.push({t:'restart',same:false}); }
    return A; }
  cardActions(c,A){ const d=D[c.def];

    if(c.def==='visit'&&c.item&&c.st==='ask') for(const how of this.apMethods(c)) A.push({t:'appraise',uid:c.uid,how,score:0.7});
    const slots=this.slotsOf(c);
    for(const sl of slots){ if(c.fill[sl.id]) A.push({t:'unslot',uid:c.uid,slot:sl.id}); else for(const ref of this.eligible(c,sl).slice(0,3)) A.push({t:'slot',uid:c.uid,slot:sl.id,ref}); }
    if(d.wheel){ for(const m of this.spinModes(c)) A.push({t:'spin',uid:c.uid,mode:m}); }

  apply(a){ const s=this.s; try{
    if(!a||!a.t) return {ok:false};
    if(a.t==='restart'){ const seed=a.same?s.seed:(a.seed||String((parseInt(s.seed,10)||7)*31%899999+100000)); this.s=new Game(seed).s; return {ok:true}; }

    if(a.t==='redeem'){ if(!this.canRedeem(a.id)) return {ok:false}; this.redeemAsset(a.id); return {ok:true}; }
    if(a.t==='play'){ const k=s.kept.find(x=>x.uid===a.uid); if(!k||!(KEPT[k.k].plays||[]).some(p=>p.id===a.id)||this.playDis(k,a.id)) return {ok:false}; const t=this.play(k,a.id); if(t) this.log(t); return {ok:true,text:t}; }

    if(a.t==='appraise'){ if(!c.item||c.st!=='ask'||!this.apMethods(c).includes(a.how)) return {ok:false}; const t=this.appraise(c,a.how,a.score,a.reading); return {ok:true,text:t}; }
    if(a.t==='slot'){ const sl=this.slotsOf(c).find(x=>x.id===a.slot); if(!sl||!this.refOk(c,sl,a.ref)) return {ok:false}; c.fill[sl.id]=Object.assign({},a.ref); return {ok:true}; }

    if(a.t==='roll'){ if(!this.slotsOf(c).length||D[c.def].wheel) return {ok:false}; this.roll(c); return {ok:true}; }
    if(a.t==='spin'){ return {ok:this.spin(c,a.mode)}; }
    return {ok:false};
  }catch(e){ if(typeof console!=='undefined') console.error('apply failed',a,e); return {ok:false,err:String(e&&e.message||e)}; } }

  /* ---- 打烊 ---- */
  closePreview(){ const s=this.s, L=[];
    for(const c of s.hand){ if(c.done) continue; const d=D[c.def]; let line;
      if(c.def==='visit'){ const n=P[c.p].name; line=c.kind==='gold'?`${n}会走（金色牌，档案簿留缺口）`:c.intent==='redeem'?`${n}会走，当票到期就满当`:`${n}会走`; if(['ma','hu2'].includes(c.p)) line+='，他会记仇'; }
      else line=d.ignoreLine?d.ignoreLine(this,c):`${this.cardTitle(c)}按没理会处理`;
      L.push(line); }
    for(const n of s.notes) if(!n.done){ if(n.due<=s.day) L.push(`条子（${NOTE_CAT[n.cat]}）今天到期，没办成要${NOTE_PENALTY[n.tier]}`); else if(L.length) L.push(`条子（${NOTE_CAT[n.cat]}）还剩 ${n.due-s.day} 天，继续计时`); }
    for(const k of s.kept) if(k.exp&&k.exp<=s.day) L.push(`“${KEPT[k.k].name}”今晚到期`);
    return L; }
  unresolved(){ return this.s.hand.filter(c=>!c.done).length; }
  close(){ const s=this.s;
    for(const c of s.hand){ if(c.done) continue; const d=D[c.def]; let res;
      if(c.def==='visit'){ const n=P[c.p].name;
        if(c.kind==='gold'){ this.gap(c.p); res=c.gold==='linsao'?'林嫂在门口站了站，扶着腰走了。':`${n}走了。`; s.flags[c.gold]='ignored'; }
        else res=c.intent==='redeem'?`${n}没等到你，走了。`:`${n}等不到你，走了。`;
        if(c.p==='ma'||c.p==='hu2') this.heat(3); if(c.p==='guanjia'||c.p==='sunyoung') this.rep(-2); }
      else res=d.ignore?d.ignore(this,c):'没理会。';
      c.done=true; c.ignored=true; c.res=res||'没理会。'; c.fill={}; if(res) this.log(`${this.cardTitle(c)}：${res}`);
      if(s.phase!=='day') break; }

    s.phase='night'; this.teach('night');
    const avail=Object.keys(NIGHT).filter(id=>(!NIGHT[id].minDay||NIGHT[id].minDay<=s.day));
    s.nightOffer=this.rng('night').shuffle(avail).slice(0,3); }
  nightDis(id){ const s=this.s; if((id==='back'||id==='wire')&&s.df.curfew) return '宵禁提前，今晚不能出门'; if(id==='back'&&this.shelfFree()<1) return '货架满了'; if(id==='wire'&&s.money<4) return '钱不够'; return null; }
  night(id){ const s=this.s, d=s.day, r=this.rng('nightdo'), lines=[];
    if(id==='tidy'){ for(const it of s.shelf) it.polish=true; lines.push('货架擦得发亮，东西好出手些。'); }
    if(id==='books'){ const wk=s.ledger.filter(x=>x.d>d-7).reduce((a,b)=>a+b.n,0); lines.push(`对了账：这几天${wk>=0?'赚了':'赔了'} ${Math.abs(wk)} 蚨。`); if(r.chance(0.4)) this.pin(d+1,{kind:'news',def:'ne_books'}); else if(!s.flags.blankFound&&r.chance(0.5)){ s.flags.blankFound=true; this.gainKept('blank_ticket'); lines.push('抽屉底下翻出一张盖了印的空白当票。'); } }
    if(id==='back'){ const cat=r.pick(['utensils','clothing','jewelry','medicine','art']); const N=CONFIG.night, it=this.mkItem(r,cat,null,{stolenP:N.backStolenP,fakeP:N.backFakeP}); const p=Math.round(it.base*N.backPriceMul);
      if(s.money>=p){ this.money(-p,'后门收货'); it.paid=p; this.addItemToShelf(it); this.heat(N.backHeat); s.df.back=true; lines.push(`后门收了一件${it.name}，${p} 蚨。`); } else lines.push('敲门的人见你掏不出钱，走了。'); }
    if(id==='wire'){ this.money(-4,'电报费'); this.frag('brother',`三月${CN_NUM[d]}日，你发电报：“铺在。人在。”`); s.df.back=true; if(r.chance(0.6)) this.pin(d+1,{kind:'news',def:'ne_wire_reply'}); lines.push('电报发出去了。'); }
    if(id==='home'){ s.df.home=true; if(s.lifeDebt.length){ s.lifeDebt.sort((a,b)=>b.n-a.n); const x=s.lifeDebt.shift(); lines.push(`一家人凑了凑，把“${x.t}”对付过去了。`); } else { this.heart(3); if(r.chance(0.4)) this.pin(d+1,{kind:'news',def:'ne_family'}); lines.push('一家人吃了顿饭。'); } }
    if(id==='sleep'){ s.extraVisitor=d+1; s.df.sleep=true; lines.push('早早睡了。明天多来一个人。'); }
    if(id==='none') lines.push('什么也没做，睡了。');
    // 黄历
    const yi=YI.find(x=>x.id===s.almanac.yi), ji=JI.find(x=>x.id===s.almanac.ji);
    if(yi&&yi.ok(s.df)&&!(ji&&ji.bad(s.df))){ if(r.chance(0.5)){ this.money(CONFIG.almanacMoney,'照黄历办事的彩头'); lines.push(`照着黄历“${yi.t}”办了，晚上收到一笔小账，${CONFIG.almanacMoney} 蚨。`); } else { this.rep(3); lines.push(`照着黄历“${yi.t}”办了，街坊说你做事有讲究。`); } }
    this.settle(lines); }

  /* ---- 夜里结算 ---- */
  settle(lines){ const s=this.s, d=s.day; let week=null;
    // 当票
    for(const t of s.tickets.slice()){ if(t.due<=d){ s.tickets=s.tickets.filter(x=>x!==t); if(!t.sold){ const it=t.item; it.paid=t.principal; this.addItemToShelf(it); lines.push(`德字第${t.no}号满当：${it.name}归了铺子。`); this.teach('forfeit'); this.frag(t.owner,`德字第${t.no}号的${it.name}没来赎，满当了。`); } else lines.push(`德字第${t.no}号到期没人来，卖掉的东西不用赔了。`); } }
    // 留着的牌到期
    for(const k of s.kept.slice()){ if(k.exp&&k.exp<=d){ const K=KEPT[k.k]; this.loseKept(k.uid);
      if(k.k==='box'){ this.money(300,'保管箱子的酬劳'); lines.push('箱子被人取走了，留下三百 蚨。'); }
      else if(k.k==='guarantee'){ if(new Rng(s.seed+'|guarantee').chance(0.5)){ this.money(-300,'作保赔的钱'); lines.push('孙老爷那笔生意出了岔子，作保的你赔了三百。'); } else { this.money(20,'作保的谢礼'); lines.push('孙老爷的生意做成了，送来二十的谢礼。'); } }
      else if(k.k==='leaflets'){ this.heart(3); this.gainContact('li'); this.frag('li','他来取走了那包东西，冲你鞠了一躬。'); lines.push('李敬之取走了那包东西。'); }
      else { lines.push(`“${K.name}”放久了，不灵了。`); this.teach('kept_expire'); } } }
    // 条子
    for(const n of s.notes){ if(!n.done&&n.due<=d) this.noteFail(n,lines); }
    // 风声
    const H=CONFIG.heat; let hp=0; hp+=Math.min(H.stolenCap,H.stolenPerNight*this.stolenCount()); if(this.isContact('ma')) hp+=H.maPerNight; if(this.isContact('wangshan')) hp+=H.wangshanPerNight; if(s.fortune==='xiao') hp+=H.xiaoPerNight; if(hp) this.heat(hp);
    if(!hp&&!s.jail) this.heat(-H.decay);
    // 人脉回来
    for(const pid of Object.keys(s.away)){ s.away[pid]--; if(s.away[pid]<=0){ delete s.away[pid]; if(s.contacts.includes(pid)) lines.push(`${P[pid].name}回来了。`); } }
    s.sealed=s.sealNext||0; s.sealNext=0;
    if(s.jail&&s.jail.need>=CONFIG.jail.maxNeed){ this.gameOver('long'); return; }
    if(s.jailNext&&!s.jail){ s.jail={need:CONFIG.jail.need,days:0}; lines.push('一早，有人来带你走。'); } s.jailNext=false;
    if(s.heat>=CONFIG.heat.jailAt&&!s.jail){ s.jail={need:CONFIG.jail.heatNeed,days:0}; s.heat=CONFIG.heat.jailResetTo; lines.push('风声到顶，警察上门带人。'); }
    if(d===7||d===14){ week=this.weekSettle(d); this.teach('settle'); }
    this.crisisCheck();
    if(d>=MAX_DAY){ s.phase='end'; s.ending=s.ending||{kind:'done',text:''}; s.report={day:d,lines,week}; s.review=this.makeReview(); return; }
    s.report={day:d,lines,week};
    s.day++; this.startDay(); }
  weekSettle(d){ const s=this.s, L=[]; const before=s.money;
    const living=this.lifeCost(CONFIG.week.living+((s.assets.laozhai.m||s.assets.laozhai.lost)?CONFIG.week.laozhaiExtra:0)); this.money(-living,'一周的生活开销'); L.push(`一周的生活开销：${living} 蚨`);
    if(s.lifeDebt.length){ const n=s.lifeDebt.reduce((a,b)=>a+b.n,0); this.money(-n,'拖着的账'); L.push(`拖着的账（${s.lifeDebt.map(x=>x.t).join('、')}）：${n} 蚨`); s.lifeDebt=[]; }
    let intr=0; for(const k of ASSET_ORDER) if(s.assets[k].m) intr+=Math.round(ASSETS[k].value*CONFIG.assetInterestWeek); if(intr){ this.money(-intr,'抵押利息'); L.push(`抵押利息：${intr} 蚨`); }
    if(d===14&&s.assets.pumian.m){ s.assets.pumian.m=false; s.assets.pumian.lost=true; L.push('铺面押出去没赎回来，归了押主。'); }
    const wk=s.ledger.filter(x=>x.d>d-7);
    const inc=wk.filter(x=>x.n>0).reduce((a,b)=>a+b.n,0), out=wk.filter(x=>x.n<0).reduce((a,b)=>a+b.n,0);
    return {lines:L,inc,out:-out,money:s.money,before,tickets:s.tickets.length}; }
  crisisCheck(){ const s=this.s, b=s.big, X=CONFIG.crisis; if(b.n>=X.max||b.pending) return; let c=null;
    if((s.jail||s.jailNext)&&!b.used.jail) c='jail'; else if(s.heat>=X.heatAt&&!b.used.heat) c='heat'; else if(!b.used.broke&&this.isBroke()) c='broke'; else if(s.street&&s.streetDays>=X.streetDays&&!b.used.street) c='street';
    if(c){ b.pending=c; b.used[c]=true; b.n++; } }
  isBroke(){ const s=this.s; const mort=ASSET_ORDER.filter(k=>s.assets[k].m||s.assets[k].lost).length; const n=s.notes.find(x=>!x.done&&x.cat==='money'); return (s.money<0&&mort>=CONFIG.crisisBrokeMinMort)||(n&&s.money<CONFIG.note.money[n.tier]&&mort>=3)||(s.money<40&&mort>=4); }

  /* ---- 两周评语 ---- */

    const st=s.stats, pages=Object.keys(s.dossier).filter(k=>s.dossier[k].frags.length).length;

    return {lines:L,stats,day:s.day}; }
}

function reconcile(layer,specs){ const have=new Map(); for(const el of Array.prototype.slice.call(layer.children)){ if(el.dataset&&el.dataset.k) have.set(el.dataset.k,el); }

    let cls=sp.cls+' '+artClass(sp.art||''); if(fresh&&!red){ el._entering=true; if(sp.walk) el._delayed=true; }

        requestAnimationFrame(()=>requestAnimationFrame(done)); setTimeout(done,140); } } }

/* 引号里、并且前面是“：”或句末的，算人说的话；其余是旁白。台词都是占位文字。 */
function segSay(p){ const segs=[]; let i=0, buf='';
  while(i<p.length){ const a=p.indexOf('“',i); if(a<0){ buf+=p.slice(i); break; } const b=p.indexOf('”',a+1); if(b<0){ buf+=p.slice(i); break; }
    const before=p.slice(i,a), inner=p.slice(a+1,b); const prev=(buf+before).trim().slice(-1);
    const speech=(prev===''||/[：:。！？]/.test(prev))&&/[。！？…—]$/.test(inner);
    if(speech){ buf+=before; if(buf.trim()) segs.push({say:false,t:buf}); buf=''; segs.push({say:true,t:inner}); } else buf+=before+'“'+inner+'”';
    i=b+1; }
  if(buf.trim()) segs.push({say:false,t:buf}); return segs; }
function chunkText(t,max){ const parts=t.match(/[^。！？]+[。！？”]*/g)||[t]; const out=[]; let cur='';
  for(const p of parts){ if(cur&&(cur+p).length>max){ out.push(cur); cur=p; } else cur+=p; } if(cur.trim()) out.push(cur); return out; }
function splitSay(text,who){ const out=[]; if(!text) return out;
  for(const para of String(text).split('\n')){ for(const sg of segSay(para)){
      if(sg.say){ for(const t of chunkText(sg.t,30)) out.push({kind:'say',who:who||null,text:'“'+t.trim()+'”'}); }
      else { let t=sg.t.trim().replace(/[：:]$/,'。').replace(/^[，。、]+/,''); if(!t) continue; for(const x of chunkText(t,44)) out.push({kind:'narr',text:x.trim()}); } } }
  return out; }

    if(c.intent==='pawn'||c.intent==='sell'){ const t=g.cardText(c).split('\n'); if(c.kind!=='gold'&&GREET_VISIT[c.intent]&&!/“/.test(t[0])) L.push({kind:'say',who:sp,text:GREET_VISIT[c.intent]}); L.push(...splitSay(t[0],sp));
      const it=c.item; if(it){ const V=CATS[it.cat].v.find(v=>v.id===it.vid); L.push({kind:'narr',text:`柜上放着${it.name}。${V?V.mat:''}`}); }
      L.push({kind:'say',who:sp,text:`“${c.intent==='pawn'?'想当':'要价'} ${c.ask} 蚨。${c.claim?`说是 ${fmtQian(c.claim)}重。`:''}”`}); }
    else { if(GREET_VISIT[c.intent]) L.push({kind:'say',who:sp,text:GREET_VISIT[c.intent]}); L.push(...splitSay(g.cardText(c),sp)); }
  } else if(c.def==='note'){ L.push({kind:'narr',text:'你把柜边那张条子取下来，去找胡二。'}); L.push(...splitSay(g.cardText(c),null)); }
  else { if(sp&&GREET_WHO[sp]&&c.kind!=='gold') L.push({kind:'say',who:sp,text:GREET_WHO[sp]}); else if(c.kind==='gold'&&sp) L.push({kind:'narr',text:`${name}来了。`});
    L.push(...splitSay(g.cardText(c),sp));
    if(st.about&&st.about!==sp&&P[st.about]) L.push({kind:'sys',text:`说的是${whoName(st.about)}的事 · 记下就进档案簿`}); }
  if(c.msg) L.push(...splitSay(c.msg,sp));
  if(!L.length) L.push({kind:'narr',text:g.cardTitle(c)+'。'});
  return L; }
function farewell(c){ if(c.def!=='visit'||c.ignored) return []; const n=whoName(c.p); if(/走|出了门|跑去/.test(c.res||'')) return []; return [{kind:'narr',text:`${n}告辞，出了门。`}]; }

function rollSummary(r){ const h=r.faces.filter(Boolean).length; return {kind:'sys',text:`正面 ${h}${r.auto?` + 算 ${r.auto}`:''} / 要 ${r.need}：${r.pass?'证件一亮，直接过':r.ok?'成了':'没成'}`}; }
function echoLine(c,o){ const L=String(o.label), id=o.id; const num=(L.match(/(\d+)\s*蚨/)||[])[1];
  if(/^offer\d$/.test(id)) return {kind:'me',text:`“${num} 蚨。${c.intent==='pawn'?'当不当？':'卖不卖？'}”`,tag:L.split(' · ')[0]};
  if(/^price\d$/.test(id)) return {kind:'me',text:`“${num} 蚨，您看行不行。”`,tag:L.split(' · ')[0]};
  if(id==='take'&&c.def==='visit') return {kind:'me',text:'“行，就依你。”'};
  if(id==='refuse'&&c.def==='visit') return {kind:'me',text:c.intent==='buy'?'“这个价，不卖了。”':'“这个，铺子不收。”'};
  if(id==='none'&&c.def==='visit') return {kind:'me',text:'“铺子里没有合适的。”'};
  if(/^pick:/.test(id)) return {kind:'me',text:'“您看看这个。”',tag:L};
  const q=L.match(/“[^”]+”/); if(q&&(L.indexOf('“')===0||/[：:]“/.test(L))) return {kind:'me',text:q[0],tag:L.indexOf('“')>0?L.slice(0,L.indexOf('“')).replace(/[：:]$/,''):''};

const AP_LABEL={look:'拿放大镜细看',weigh:'上戥子称一称',blow:'捏住银元吹一下，听声'};

/* ---- 状态 ---- */
function dlgLine(){ const d=ui.dlg; return d?d.lines[d.i]:null; }

/* 追加几句：你的回话先放进去（显示成“上一句”），光标停在第一句回应上 */
function pushLines(me,L){ const d=ui.dlg; if(!d) return; if(me) d.lines.push(me); if(L&&L.length){ d.lines.push(...L); d.i=d.lines.length-L.length; } else d.i=d.lines.length-1; d.c=me&&!(L&&L.length)?9999:0; }
let twTimer=null;
function startTyper(){ const d=ui.dlg; const l=d&&d.lines[d.i]; if(!l) return;
  if(!settings.typer||reduced()){ d.c=l.text.length; return; }
  if(d.c>=l.text.length||twTimer) return;
  twTimer=setInterval(()=>{ const d=ui.dlg; const l=d&&d.lines[d.i]; if(!l){ clearInterval(twTimer); twTimer=null; return; }
    d.c=Math.min(l.text.length,d.c+2); const el=document.getElementById('dtext'); if(el) el.textContent=l.text.slice(0,d.c);

  ui.dlg=null; render(); }
function dlgSkip(){ const d=ui.dlg; if(!d||d.hold) return; d.i=d.lines.length-1; d.c=d.lines[d.i]?d.lines[d.i].text.length:0; render(); }
function endCard(){ ui.active=null; ui.dlg=null; ui.rollShow=null; ui.wheel=null; render(); }
function shelve(){ ui.active=null; ui.dlg=null; ui.rollShow=null; ui.wheel=null; }

/* ---- 打出一张牌：这个人进门，开口说话 ---- */
function playCard(uid){ const c=g.findCard(uid); if(!c||c.done||g.s.phase!=='day'||ui.screen!=='game') return;

function chooseOpt(uid,id){ const c=g.findCard(uid); if(!c||c.done) return; const o=g.cardOpts(c).find(x=>x.id===id); if(!o||o.dis) return;
  const me=echoLine(c,o); const fake=id==='fake';
  if(fake){ ui.fresh[uid]='pending'; ui.rollShow=uid; }
  const r=apply0({t:'opt',uid,id}); if(!r.ok){ commit(); return; }

function holdForCoins(uid,n){ const d=ui.dlg; if(d){ d.hold=true; d.c=9999; } const dur=reduced()?0:900+70*Math.min(n||1,14)+250;
  setTimeout(()=>{ ui.fresh[uid]='shown'; const d=ui.dlg; if(d&&d.uid===uid&&d.hold){ d.hold=false; const c=g.findCard(uid); if(c){ const L=(c.roll?[rollSummary(c.roll)]:[]).concat(resultLines(c)); d.lines.push(...L); d.i=d.lines.length-L.length; d.c=0; } } render(); },dur); }
function doRoll(uid){ const c=g.findCard(uid); if(!c||c.done) return; const label=D[c.def].rollLabel||'掷铜钱';
  ui.fresh[uid]='pending'; ui.rollShow=uid; const r=apply0({t:'roll',uid}); if(!r.ok){ ui.fresh[uid]=null; ui.rollShow=null; commit(); return; }

function doAppraise(uid,how,score,reading){ const c=g.findCard(uid); if(!c) return; const r=apply0({t:'appraise',uid,how,score,reading});

function wheelDone(uid){ const c=g.findCard(uid); ui.wheel=null; if(c&&c.done){ ensureDlg(c); ui.active=uid; pushLines({kind:'me',text:'（转了一次轮盘）'},resultLines(c)); } render(); }
function doPlayKept(kuid,id){ const k=g.s.kept.find(x=>x.uid===kuid); if(!k) return; const K=KEPT[k.k]; const p=(K.plays||[]).find(x=>x.id===id);
  const r=apply0({t:'play',uid:kuid,id}); ui.sel=null;
  if(r.ok){ if(!ui.active) ui.dlg={mode:'narr',lines:[{kind:'me',text:`（${p?p.label:K.name}）`}].concat(splitSay(r.text||'',null)),i:1,c:0}; else flash(r.text||''); }

/* ---- 打烊、夜里 ---- */
function onNextDay(){ ui.drawer=null; ui.picker=null; ui.mini=null; ui.assetConfirm=null; ui.sel=null;
  if(ui.screen==='title'){ const inp=$('#seedin'); startNew(inp&&inp.value.trim()?inp.value.trim().slice(0,24):ui.seedInput); return; }
  const s=g.s; if(s.report&&s.report.week) ui.weekShown=s.report.day;
  if(s.phase==='night'){ doNight('none'); return; }
  if(s.phase==='end'||s.phase==='over'){ startNew(randomSeed()); return; }
  if(s.phase!=='day'){ render(); return; }
  const L=g.closePreview(); if(L.length&&!ui.confirm){ ui.confirm=true; render(); const b=$('[data-act="confirmclose"]'); if(b) try{ b.focus({preventScroll:true}); }catch(e){} return; }
  doClose(); }
function doClose(){ const day=g.s.day; ui.confirm=false; shelve(); ui.sel=null; const before=g.s.hand.filter(c=>!c.done).map(c=>c.uid);
  apply0({t:'close'}); const s=g.s;
  if(s.phase==='night'){ const L=[{kind:'sys',text:`第 ${day} 天 · 打烊`},{kind:'narr',text:'上了门板，点上油灯。'}];

function doNight(id){ const s=g.s; const day=s.day; const r=apply0({t:'night',id}); if(!r.ok){ flash('今晚做不了这个。'); commit(); return; }

/* ---- 对话框的样子 ---- */
function itemInfoHTML(it,claim,buy){ if(!it) return ''; const tags=[CATS[it.cat]?CATS[it.cat].label:'',`成色：${it.worn?'旧':'尚好'}`]; if(claim) tags.push(`说是 ${fmtQian(claim)}`); if(buy&&it.paid) tags.push(`收价 ${it.paid}`); if(buy&&it.pawned) tags.push('当物，还没满当'); if(it.polish) tags.push('擦亮了');

function repliesHTML(c){ let h=''; const d=D[c.def]; const opts=g.cardOpts(c); const sls=g.slotsOf(c);

      `<div class="rnote">${c.kind==='jail'?'<b class="warn">掷一次定生死：不成，这一局就到这里。</b> ':''}把人、钱、留着的牌放进柜台上的格子（拖过去，或点格子），一点本事一枚铜钱。</div>`; };
  if(c.def==='visit'&&(c.intent==='pawn'||c.intent==='sell')&&c.st==='ask'&&!c.done) for(const x of g.apMethods(c)) h+=`<button class="reply ap" data-act="ap" data-uid="${c.uid}" data-how="${x}" data-k="ap-${c.uid}-${x}"><span class="rb">◇</span><span class="rt">（${AP_LABEL[x]}）</span></button>`;

  return h+'</div>'; }
function idleHTML(){ const s=g.s; let t='';

function dialogBox(){ const L=ui.L; const box=$('#dlg'); if(!box) return;

  const skip=!d.hold&&!last?`<button class="dskip" data-act="dlg-skip" data-k="dlg-skip" title="直接到最后一句">跳过 ▸▸</button>`:'';
  let h=`${skip}${pv}<div class="dline k-${l.kind}" data-act="dlg-next" data-k="dlg-next" role="button" tabindex="0" aria-label="继续">${face}<div class="dname">${name}</div><div class="dtext" id="dtext">${esc(l.text.slice(0,d.c))}</div>${more?`<span class="dmore">${last?(c&&c.done?'送客 ▸':'合上 ▸'):'▼'}</span>`:''}</div>`;

function handList(){ const s=g.s; if(ui.screen!=='game') return [];

/* 格子：一张牌 / 一个人能放进哪个格子 */
function checkTarget(c,ref){ if(!c||c.done) return null; const sls=g.slotsOf(c); if(D[c.def].wheel&&ui.wheel!==c.uid) return null;
  if(!D[c.def].wheel&&!checkShown(c)) return null;

  const r=g.apply({t:'slot',uid,slot,ref}); if(!r.ok) flash('放不进去：可能今天用过了，或者不合这个格子。'); else { ui.rollShow=null; ui.sel=null; } commit(); }

    case 'weekok': ui.weekShown=g.s.report?g.s.report.day:-1; render(); break;
    case 'pick': ui.picker={uid:ds.uid,slot:ds.slot}; render(); break;
    case 'pickref': { const ref=parse(ds.ref); const p=ui.picker; ui.picker=null; if(p) doSlot(p.uid,p.slot,ref); else render(); break; }
    case 'closepicker': ui.picker=null; render(); break;
    case 'unslot': ui.rollShow=null; act({t:'unslot',uid:ds.uid,slot:ds.slot}); break;
    case 'money': { const c=g.findCard(ds.uid); if(!c) break; const sl=g.slotsOf(c).find(x=>x.id===ds.slot); if(!sl) break; const f=c.fill[sl.id]; const n=(f?f.n:0)+(+ds.d)*sl.unit; ui.rollShow=null;
      if(n<=0){ act({t:'unslot',uid:ds.uid,slot:ds.slot}); break; } const r=g.apply({t:'slot',uid:ds.uid,slot:ds.slot,ref:{k:'money',n}}); if(!r.ok) flash('能动的钱不够了。'); commit(); break; }
    case 'spot': spotClick(e,el); break;

    case 'b-ref': case 'b-item': { const c=g.findCard(ui.mini.uid); if(!c) break; const snd=A==='b-ref'?{decay:1.6,f:2800}:c.item.snd; ringSound(snd.decay,snd.f); if(A==='b-ref') ui.mini.ref++; else ui.mini.item++;

      const bh=$('#bhint'); if(bh) bh.textContent=`听了：标准的 ${ui.mini.ref} 遍 · 这一枚 ${ui.mini.item} 遍`; const bd=$('[data-act="b-done"]'); if(bd) bd.disabled=ui.mini.item<=0; break; }
    case 'b-done': { const m=ui.mini; const score=m.item>0?(m.ref>0?1:0.6):0.3; ui.mini=null; doAppraise(m.uid,'blow',score); break; }

    case 'restart': { const same=ds.same==='1'; startNew(same?g.s.seed:randomSeed()); break; }
    case 'loadsave': { const x=loadSave(); if(!x){ flash('没有存档。'); break; } g=x; ui.screen='game'; resetUi(); ui.savedDay=g.s.day; ui.lastMoney=g.s.money; ui.lastTiers=null; render(); flash(`读了第 ${g.s.day} 天早上的存档。`); break; }

    case 'reseed': ui.seedInput=randomSeed(); render(); break;
